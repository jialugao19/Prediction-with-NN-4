[build-system]
requires = [
  "setuptools>=61",
  "wheel",
  "pybind11>=2.10",
]
build-backend = "setuptools.build_meta"

[project]
name = "qmodel"
dynamic = ["version"]
description = "Modular training and evaluation utilities"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0",
  "numpy",
  "omegaconf",
  "nvidia-ml-py",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qmodel*"]

[tool.setuptools.dynamic]
version = { attr = "qmodel.version.__version__" }

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]
prefect = [
  "prefect>=3.6.15",
]

[project.scripts]
qmodel-submit = "qmodel.scheduling.cli_submit:main"
qmodel-run = "qmodel.experiment.cli_run:main"
qmodel-remote-submit = "qmodel.scheduling.cli_remote_submit:main"

[tool.setuptools.package-data]
qmodel = ["scheduling/orchestration.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
